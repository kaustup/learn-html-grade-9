
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>WebDev Space Academy 🚀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="starCanvas"></canvas>
  <div id="toast" class="toast"></div>

  <!-- ══════════════════ SCREEN: HOME ══════════════════ -->
  <div id="screen-home" class="screen active">
    <div class="home-wrap">

      <div class="home-header">
        <div class="rocket-anim">🚀</div>
        <h1 class="game-title">WebDev<br/><span class="title-glow">Space Academy</span></h1>
        <p class="game-sub">Grade 9 · HTML &amp; CSS Galactic Guide</p>
      </div>

      <div class="xp-panel">
        <div class="xp-row">
          <span class="xp-lbl">⚡ XP</span>
          <span id="homeXP" class="xp-number">0</span>
          <span class="xp-lbl">/ 500</span>
        </div>
        <div class="xp-track"><div class="xp-fill" id="homeXPBar" style="width:0%"></div></div>
        <div class="level-tag" id="levelTag">🌍 Cadet — Level 1</div>
      </div>

      <div class="mission-list">

        <button class="mission-card html-card" onclick="App.openLesson('html')">
          <div class="mc-icon">🌐</div>
          <div class="mc-body">
            <div class="mc-title">HTML Mission</div>
            <div class="mc-sub">Tags · Attributes · Forms · Tables · Images</div>
            <div class="mc-count" id="htmlProgress">0 / 17 topics</div>
          </div>
          <div class="mc-arrow">▶</div>
        </button>

        <button class="mission-card css-card" onclick="App.openLesson('css')">
          <div class="mc-icon">🎨</div>
          <div class="mc-body">
            <div class="mc-title">CSS Mission</div>
            <div class="mc-sub">Selectors · Properties · Box Model · Units</div>
            <div class="mc-count" id="cssProgress">0 / 7 topics</div>
          </div>
          <div class="mc-arrow">▶</div>
        </button>

        <button class="mission-card quiz-card" onclick="App.openQuiz()">
          <div class="mc-icon">🏆</div>
          <div class="mc-body">
            <div class="mc-title">Final Boss Quiz</div>
            <div class="mc-sub">20 Random Questions · Beat the Boss!</div>
            <div class="mc-count">Earn up to 200 XP</div>
          </div>
          <div class="mc-arrow">▶</div>
        </button>

      </div>

      <p class="credit-text">📚 W3Schools + Class 9 Computer Science Textbook</p>
    </div>
  </div>


  <!-- ══════════════════ SCREEN: LESSON ══════════════════ -->
  <div id="screen-lesson" class="screen">

    <div class="topbar">
      <button class="tb-back" onclick="App.goHome()">&#8592; Back</button>
      <h2 class="tb-title" id="lessonTitle">HTML</h2>
      <button class="tb-quiz" onclick="App.openQuiz()">🏆 Quiz</button>
    </div>

    <!-- mobile topic selector -->
    <div class="mobile-topic-bar" id="mobileTopicBar">
      <button class="mtb-arrow" id="mtbPrev" onclick="App.prevTopic()">‹</button>
      <span class="mtb-label" id="mtbLabel">Topic 1</span>
      <button class="mtb-arrow" id="mtbNext" onclick="App.nextTopic()">›</button>
    </div>

    <div class="lesson-layout">
      <nav class="sidebar" id="sidebar">
        <div class="sb-head">📋 TOPICS</div>
        <div id="topicList"></div>
      </nav>
      <main class="content-pane" id="contentPane">
        <!-- injected by JS -->
      </main>
    </div>

  </div>


  <!-- ══════════════════ SCREEN: QUIZ ══════════════════ -->
  <div id="screen-quiz" class="screen">

    <div class="topbar">
      <button class="tb-back" onclick="App.goHome()">&#8592; Home</button>
      <h2 class="tb-title gold">🏆 Final Boss</h2>
      <div class="tb-counter" id="quizCounter">1 / 20</div>
    </div>

    <!-- progress bar -->
    <div class="quiz-prog-wrap">
      <div class="quiz-prog-fill" id="quizProgFill" style="width:5%"></div>
    </div>

    <div class="quiz-area" id="quizArea"></div>

    <div class="score-screen hidden" id="scoreScreen">
      <div class="ss-rocket">🚀</div>
      <div class="ss-score" id="ssScore"></div>
      <div class="ss-msg"   id="ssMsg"></div>
      <div class="ss-xp"    id="ssXP"></div>
      <div class="ss-btns">
        <button class="ss-btn-home"  onclick="App.goHome()">🏠 Home</button>
        <button class="ss-btn-retry" onclick="App.openQuiz()">🔄 Retry</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
